[workspace]
resolver = "2"
members = [
	"crates/icy_draw",
	"crates/icy_engine",
	"crates/icy_engine_gui",
	"crates/icy_engine_gui_macros",
	"crates/icy_engine_edit",
	"crates/icy_play",
	"crates/icy_term",
	"crates/icy_engine_scripting",
	"crates/icy_view",
	"crates/icy_mail",
	"crates/icy_parser_core",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Mike Krüger <mkrueger@posteo.de>"]
license = "MIT or Apache-2.0"

[workspace.dependencies]
icy_engine = { path = "crates/icy_engine" }
icy_parser_core = { path = "crates/icy_parser_core" }
icy_engine_scripting = { path = "crates/icy_engine_scripting" }

icy_sauce = { git = "https://github.com/mkrueger/icy_sauce" }

#icy_sauce = { path = "../icy_sauce" }
icy_sixel = "0.6.0"
icy_net = { git = "https://github.com/mkrueger/icy_board" }
#icy_net = { path ="../icy_board/crates/icy_net" }
#unarc-rs = { path ="../unarc-rs" }
unarc-rs = { git = "https://github.com/mkrueger/unarc-rs" }
retrofont = { git = "https://github.com/mkrueger/retrofont" }
#retrofont = { path ="../retrofont/crates/retrofont" }

icy_engine_gui = { path = "crates/icy_engine_gui" }
icy_engine_edit = { path = "crates/icy_engine_edit" }

#libyaff = { path = "../libyaff" }
libyaff = { git = "https://github.com/mkrueger/libyaff" }

codepages = { git = "https://github.com/mkrueger/icy_board" }
zip = "8.6.0"
lazy_static = "1.5.0"
semver = "1.0.28"
thiserror = "2.0.20"
clap = { version = "4.6.6", features = ["derive"] }
log = "0.4.33"
flexi_logger = "0.31.10"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
walkdir = "2.5.0"
i18n-embed = { version = "0.16.0", features = [
	"fluent-system",
	"desktop-requester",
] }
i18n-embed-fl = "0.10.1"
fluent-bundle = "0.16.0"
rust-embed = "8.12.0"
once_cell = "1.21.4"
toml = "1.1.4"
bstr = "1.13.0"
fastrand = "2.5.0"
base64 = "0.23.1"
opus = "0.3.1"
symphonia = { version = "0.5.5", default-features = false, features = ["ogg"] }
rmcp = "3.1.2"
serde_json = "1.0.151"
image = "0.25.10"
jxl-oxide = { version = "0.12.6", features = ["image"] }
bitflags = "2.13.1"
rfd = "0.17.2"
open = "5.4.1"
bytemuck = "1.25.2"

regex = "1.13.1"
directories = "6.0.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3"
anstream = "1.0.0"
rodio = { version = "0.22.2" }
cpal = "0.17.3"
# Atari ST GIST sound emulation (IGS)
ym2149-gist-replayer = "0.9.1"
anyhow = "1.0.104"
webbrowser = "1.2.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "blocking"] }
rayon = "1.12.0"
notify = "8.2.0"
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
string-interner = "0.20.0"
cascada = "0.3.1"
gif = "0.14.2"
quantette = "0.6.0"
crc32fast = "1.5.0"

# SVG and font rendering
resvg = "0.48.1"
ab_glyph = "0.2"

#icy_ui = { path = "../icy_ui/crates/icy_ui" }
icy_ui = { git = "https://github.com/mkrueger/icy_ui", branch = "master" }

versions = "7.0.0"
github_release_check = "0.2.1"
parking_lot = "0.12.5"
clap-i18n-richformatter = { git = "https://github.com/eatradish/clap-i18n-richformatter" }

[profile.release]
opt-level = 'z'   # Optimize for size
lto = true        # Enable link-time optimization
codegen-units = 1 # Reduce number of codegen units to increase optimizations
panic = 'abort'   # Abort on panic
strip = true      # Strip symbols from binary*

[profile.profiling]
inherits = "release"
debug = true
strip = false

## NOTE: This workspace used to override `iced_aw` with a local vendored copy.
## The `vendor/iced_aw` directory is not present in this repo checkout, which breaks
## `cargo fetch/check` in clean environments. If you keep a local vendor, re-add this
## patch locally.
[patch.crates-io]
# sevenz-rust2 v0.20.0 pins lzma-rust2 = "=0.15.3" which is incompatible with crc v2.x
# Override to v0.15.4 which has the fix
lzma-rust2 = { git = "https://github.com/hasenbanck/lzma-rust2", branch = "master" }
