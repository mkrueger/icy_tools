[package]
name = "icy_draw"
version = "0.6.2"
edition = "2021"
authors = ["Mike Krüger <mkrueger@posteo.de>"]
description = "A drawing program for ANSI & ASCII art and other text-based art forms."
license = "Apache-2.0"
repository = "https://github.com/mkrueger/icy_tools"
autobins = false
default-run = "icy_draw"

[[bin]]
name = "icy_draw"
path = "src/bin/icy_draw.rs"
required-features = ["egui"]

[[bin]]
name = "icy_draw_egui"
path = "src/bin/icy_draw_egui.rs"
required-features = ["egui"]

[[bin]]
name = "icy_draw_legacy"
path = "src/main.rs"
required-features = ["legacy-ui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Frontends
icy_ui = { workspace = true, optional = true, features = ["wgpu", "highlighter"] }
eframe = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
github-copilot-sdk = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true }

# GPU/Shader support
bytemuck = { workspace = true, features = ["derive"] }

# Layout engine
cascada = { workspace = true }

# SVG rendering for icons
resvg = { workspace = true, features = ["default"] }
tiny-skia = { workspace = true }
usvg = { workspace = true }

# Logging
log = { workspace = true }
flexi_logger = { workspace = true }

# CLI
clap = { workspace = true }
clap-i18n-richformatter = { workspace = true }

# Core icy_* crates
icy_engine = { workspace = true }
icy_parser_core = { workspace = true }
fastrand = { workspace = true }
icy_engine_edit = { workspace = true }
icy_engine_gui = { workspace = true, features = ["opus-audio"] }
icy_engine_scripting = { workspace = true }

# WebSocket for collaboration
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

# Lua scripting for plugins
mlua = { workspace = true }
regex = { workspace = true }
icy_sauce = { workspace = true }
retrofont = { workspace = true }

# Encoding
base64 = { workspace = true }
codepages = { workspace = true }
libyaff = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bitcode = { workspace = true }

# CRC32 for autosave path hashing
crc32fast = { workspace = true }

# i18n
i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
rust-embed = { workspace = true }
once_cell = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Utilities
chrono = { workspace = true, features = ["default", "serde"] }
directories = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
image = { workspace = true, features = ["png", "bmp", "jpeg"] }
gif = { workspace = true }
quantette = { workspace = true, features = ["image"] }

# AV1 video export (pure Rust, outputs IVF container)
rav1e = { workspace = true }
num_cpus = { workspace = true }

# Parallel iteration for performance
rayon = { workspace = true }

# TTF font rasterization
fontdue = { workspace = true }

# File handling
walkdir = { workspace = true }
tempfile = { workspace = true }
notify = { workspace = true }
rfd = { workspace = true, optional = true }
open = { workspace = true }

# MCP (rmcp + HTTP server)
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
axum = { workspace = true }
schemars = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { workspace = true, optional = true }
x11rb = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }

[features]
default = ["egui"]
legacy-ui = ["dep:icy_ui", "dep:rfd", "icy_engine_edit/legacy-ui", "icy_engine_gui/legacy-ui"]
egui = ["dep:eframe", "dep:rfd", "dep:reqwest", "dep:github-copilot-sdk", "dep:async-trait", "dep:winit", "dep:x11rb", "dep:raw-window-handle", "icy_engine_gui/egui"]

# Opt-in: enable rav1e's NASM-based assembly optimizations.
rav1e-asm = ["rav1e/asm"]

[build-dependencies]
winres = { workspace = true }
chrono = { workspace = true, features = ["clock"] }

[package.metadata.bundle]
name = "Icy Draw"
identifier = "com.github.icy_draw"
icon = [ "build/mac/128x128@2x.png" ]
resources = []
copyright = "Copyright (c) Mike Krüger 2022. All rights reserved."

[package.metadata.deb]
section="Network"
copyright = "Copyright (c) Mike Krüger 2022. All rights reserved."
revision=""
assets = [
    ["target/release/icy_draw", "/usr/bin/", "755"],
    ["build/linux/icy_draw.desktop", "/usr/share/applications/", "644"],
    ["build/linux/128x128.png", "/usr/share/icons/hicolor/128x128/apps/icy_draw.png", "644"],
    ["build/linux/256x256.png", "/usr/share/icons/hicolor/256x256/apps/icy_draw.png", "644"],
]
