[package]
name = "icy_engine"
version = "0.5.0"
authors.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = [ "minimal"]
minimal = []

[dependencies]
lazy_static = { workspace = true }
base64 =  { workspace = true }
log = { workspace = true }
rfind_url = "0.4.4"
chrono = { workspace = true }
png = "0.18.1"
flate2 = "1"
regex = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
byteorder = "1"
bstr = { workspace = true }
codepages = { workspace = true }
rayon = { workspace = true }
icy_net = { workspace = true }
parking_lot = { workspace = true }
retrofont = { workspace = true }

icy_sauce = { workspace = true }
icy_sixel = { workspace = true }
icy_parser_core = { workspace = true }
bitflags = { workspace = true }
utf8parse = "0.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
unarc-rs = { workspace = true }

libyaff = { workspace = true }

# ICY v1 chunk compression; pure Rust so icy_engine also builds for wasm32.
ruzstd = "0.9"

# Image export support
image = { workspace = true }
jxl-oxide = { workspace = true }
lodepng = {version ="3.12.2", default-features = false, features = ["cfzlib"] }

# GIF encoding (replaces gifski)
gif = { workspace = true }
quantette = { workspace = true }

imgref = "1.12.2"
rgb = "0.8.53"
fastrand.workspace = true

[dev-dependencies]
# Checks that files written by the C zstd library still load.
zstd = "0.13"
walkdir = { workspace = true }
pretty_assertions = "1.4.1"
env_logger = "0.11"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "render_region"
harness = false

[[bench]]
name = "xbin_loading"
harness = false

[[bench]]
name = "xbin_encoding"
harness = false

[[bench]]
name = "icy_draw_bench"
harness = false
