[package]
name = "icy_engine"
version = "0.5.0"
authors.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = [ "minimal", "embedded-fonts"]
minimal = []
# Compiles the bitmap and BGI stroke fonts into the crate. Without it the
# font lookups return None/Err for those fonts, and an embedder supplies its
# own (see `fonts::install_ansi_font`, `BitFont::from_bytes`).
embedded-fonts = []

[dependencies]
lazy_static = { workspace = true }
base64 =  { workspace = true }
log = { workspace = true }
rfind_url = { workspace = true }
chrono = { workspace = true, features = ["default", "serde"] }
png = { workspace = true }
flate2 = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
byteorder = { workspace = true }
bstr = { workspace = true }
codepages = { workspace = true }
rayon = { workspace = true }
icy_terminal_emulation = { workspace = true }
parking_lot = { workspace = true }
retrofont = { workspace = true }

icy_sauce = { workspace = true }
icy_sixel = { workspace = true }
icy_parser_core = { workspace = true }
bitflags = { workspace = true }
utf8parse = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
unarc-rs = { workspace = true }

libyaff = { workspace = true }

ruzstd = { workspace = true }

# Image export support
image = { workspace = true }
jxl-oxide = { workspace = true }
lodepng = { workspace = true }

# GIF encoding (replaces gifski)
gif = { workspace = true }
quantette = { workspace = true }

imgref = { workspace = true }
rgb = { workspace = true }
fastrand.workspace = true
# std::time::Instant panics on wasm32-unknown-unknown; this is std::time on other targets.
web-time = { workspace = true }

[dev-dependencies]
# Checks that files written by the C zstd library still load.
zstd = { workspace = true }
walkdir = { workspace = true }
pretty_assertions = { workspace = true }
env_logger = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "render_region"
harness = false

[[bench]]
name = "xbin_loading"
harness = false

[[bench]]
name = "xbin_encoding"
harness = false

[[bench]]
name = "icy_draw_bench"
harness = false
