[package]
name = "icy_term"
version = "0.8.4"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "A BBS terminal with CP437, PETSCII, Viewdata, RIP, SkyPix, and SyncTERM door graphics/audio"
repository = "https://github.com/mkrueger/icy_tools"
default-run = "icy_term"
autobins = false

[[bin]]
name = "icy_term"
path = "src/bin/icy_term.rs"
required-features = ["egui"]

[[bin]]
name = "icy_term_legacy"
path = "src/main.rs"
required-features = ["legacy-ui"]

[[bin]]
name = "icy_term_egui"
path = "src/bin/icy_term_egui.rs"
required-features = ["egui"]

[features]
default = ["egui"]
legacy-ui = ["dep:icy_ui", "dep:rfd", "icy_engine_gui/legacy-ui", "icy_engine_gui/opus-audio"]
egui = ["dep:eframe", "dep:rfd", "dep:resvg", "dep:getrandom", "dep:rustls", "icy_engine_gui/egui", "icy_engine_gui/opus-audio"]

[dependencies]
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
resvg = { workspace = true, optional = true }
getrandom = { version = "0.3.4", optional = true }
rustls = { version = "0.23.43", optional = true }
icy_net = { workspace = true }
icy_engine = { workspace = true }
icy_engine_scripting = { workspace = true }
icy_parser_core = { workspace = true }
mlua = { workspace = true }
icy_ui = { workspace = true, optional = true, features = ["tokio", "svg", "image", "wgpu"] }

clap-i18n-richformatter = { workspace = true }
image = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
versions = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
webbrowser = { workspace = true }
icy_engine_gui = { path = "../icy_engine_gui", default-features = false }
fastrand = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
md5 = "0.8.0"
schemars = "1.2"

#sound
rodio = { workspace = true }

walkdir = { workspace = true }
toml = { workspace = true }

notify = { workspace = true }
human_bytes = { version = "0.4", default-features = false }

chrono = { workspace = true }      # Utc hanldung
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }

i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
rust-embed = { workspace = true }
once_cell = { workspace = true }
url = "2.5.8"

log = { workspace = true }
flexi_logger = { workspace = true }

directories = { workspace = true }
open = { workspace = true }
rfd = { workspace = true, optional = true }

async-recursion = "1.1.1"
async-trait = "0.1"

# MCP (rmcp + HTTP server)
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
axum = "0.8"
reqwest = { workspace = true }

[build-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
winres = "0.1"

[package.metadata.bundle]
name = "Icy Term"
identifier = "com.github.icy_term"
icon = ["build/mac/128x128@2x.png"]
resources = []
copyright = "Copyright (c) Mike Krüger 2022. All rights reserved."

[package.metadata.deb]
section = "Network"
copyright = "Copyright (c) Mike Krüger 2022. All rights reserved."
revision = ""
depends = "$auto, libasound2"
assets = [
    [
        "target/release/icy_term",
        "/usr/bin/",
        "755",
    ],
    [
        "build/linux/icy_term.desktop",
        "/usr/share/applications/",
        "644",
    ],
    [
        "build/linux/128x128.png",
        "/usr/share/icons/hicolor/128x128/apps/icy_term.png",
        "644",
    ],
    [
        "build/linux/256x256.png",
        "/usr/share/icons/hicolor/256x256/apps/icy_term.png",
        "644",
    ],
]
