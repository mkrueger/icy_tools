[package]
name = "icy_view"
version = "0.9.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/mkrueger/icy_tools"
description = "A file viewer for ANSI & ASCII art and other text-based art forms."
autobins = false
default-run = "icy_view"

[[bin]]
name = "icy_view"
path = "src/bin/icy_view.rs"
required-features = ["egui"]

[[bin]]
name = "icy_view_legacy"
path = "src/main.rs"
required-features = ["legacy-ui"]

[[bin]]
name = "icy_view_egui"
path = "src/bin/icy_view_egui.rs"
required-features = ["egui"]

[features]
default = ["egui"]
legacy-ui = ["dep:icy_ui", "dep:rfd", "icy_engine_gui/legacy-ui"]
egui = ["dep:eframe", "dep:rfd", "icy_engine_gui/egui"]

[dependencies]
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
icy_engine = { workspace = true }
icy_engine_gui = { path = "../icy_engine_gui", default-features = false, features = ["opus-audio"] }
icy_sauce = { workspace = true }
icy_parser_core = { workspace = true }
icy_net = { workspace = true }
icy_sixel = { workspace = true }
unarc-rs = { workspace = true }

icy_ui = { workspace = true, optional = true, features = ["tokio", "svg", "image", "wgpu"] }
image = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
log = { workspace = true }
flexi_logger = { workspace = true }
i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
once_cell = { workspace = true }
rust-embed = { workspace = true }
lazy_static = { workspace = true }
parking_lot = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
clap-i18n-richformatter = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "time",
    "sync",
    "fs",
] }
tokio-util = "0.7"
async-trait = "0.1"
bytemuck = { workspace = true, features = ["derive"] }
retrofont = { workspace = true }
rfd = { workspace = true, optional = true }
string-interner = { workspace = true }

# SVG and font rendering for shader-based list
resvg = { workspace = true }
ab_glyph = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
open = { workspace = true }
fastrand = { workspace = true }

reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
futures = "0.3"

[build-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
winres = "0.1"

[dev-dependencies]
zip = { workspace = true }

[package.metadata.bundle]
name = "Icy View"
identifier = "com.github.icy_view"
icon = ["build/mac/128x128@2x.png"]
resources = []
copyright = "Copyright (c) Mike Krüger 2023. All rights reserved."

[package.metadata.deb]
section = "utils"
copyright = "Copyright (c) Mike Krüger 2023. All rights reserved."
revision = ""
depends = "$auto, libasound2"
assets = [
    [
        "target/release/icy_view",
        "/usr/bin/",
        "755",
    ],
    [
        "build/linux/icy_view.desktop",
        "/usr/share/applications/",
        "644",
    ],
    [
        "build/linux/128x128.png",
        "/usr/share/icons/hicolor/128x128/apps/icy_view.png",
        "644",
    ],
    [
        "build/linux/256x256.png",
        "/usr/share/icons/hicolor/256x256/apps/icy_view.png",
        "644",
    ],
]
