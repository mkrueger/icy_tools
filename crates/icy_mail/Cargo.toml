[package]
name = "icy_mail"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "An offline QWK mail reader"
repository = "https://github.com/mkrueger/icy_tools"
autobins = false
default-run = "icy_mail"

[[bin]]
name = "icy_mail"
path = "src/bin/icy_mail.rs"
required-features = ["egui"]

[[bin]]
name = "icy_mail_egui"
path = "src/bin/icy_mail_egui.rs"
required-features = ["egui"]

[[bin]]
name = "icy_mail_legacy"
path = "src/main.rs"
required-features = ["legacy-ui"]

[features]
default = ["egui"]
legacy-ui = ["dep:icy_ui", "dep:rfd", "icy_engine_gui/legacy-ui"]
egui = ["dep:eframe", "dep:rfd", "dep:resvg", "icy_engine_gui/egui"]

[dependencies]
jamjam = { git = "https://github.com/mkrueger/icy_board", rev = "0c679e79bbd4a3a98c9352a124b512d7712609a5" }
#jamjam = { path ="../../../icy_board/crates/jamjam" }

icy_ui = { workspace = true, optional = true, features = [ "tokio", "svg", "image", "wgpu" ] }
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
resvg = { version = "0.48.1", optional = true, default-features = false }

tokio = { workspace = true }
serde = { workspace = true }
versions = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
webbrowser = { workspace = true }
icy_engine_gui = { path = "../icy_engine_gui", default-features = false, features = ["opus-audio"] }
icy_parser_core = { workspace = true }
parking_lot = { workspace = true }
bstr = { workspace = true }
clap = { workspace = true }
#sound
rodio = { workspace = true }
icy_engine = { workspace = true }
walkdir = { workspace = true }
toml = { workspace = true }
image = { workspace = true  }

lazy_static = { workspace = true }
notify = { workspace = true }
human_bytes = { version = "0.4", default-features = false }

chrono = { workspace = true }  # Utc hanldung
thiserror = { workspace = true }
anyhow = { workspace = true }

i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
rust-embed = { workspace = true }
once_cell = { workspace = true }
zip = { workspace = true }

log = { workspace = true }
log4rs = "1.4.0"
web-time = "1.1.0"

# WebSocket support
tungstenite = { version = "0.30.0", features = [
    "rustls-tls-webpki-roots", # webpki root CAs
    "__rustls-tls",            # use Rustls
]}

http = "1.5.0"
url = "2.5.8"
rustls = { version = "0.23.43", features = [
    "tls12",
 #   "dangerous_configuration"  # Allow invalid certs/etc.
]}
webpki-roots = "1.0.9"
getrandom =  { version = "0.4.3" }

directories = { workspace = true }
open =  { workspace = true }
rfd =  { workspace = true, optional = true }

tracing-subscriber = "0.3"
async-recursion = "1.1.1"

[build-dependencies]
winres = "0.1"

[package.metadata.bundle]
name = "Icy Mail"
identifier = "com.github.icy_mail"
icon = [ "build/mac/128x128@2x.png" ]
resources = []
copyright = "Copyright (c) Mike Krüger 2025. All rights reserved."

[package.metadata.deb]
section="Mail"
copyright = "Copyright (c) Mike Krüger 2025. All rights reserved."
revision=""
depends = "libasound2"
assets = [
    ["target/release/icy_mail", "/usr/bin/", "755"],
    ["build/linux/icy_mail.desktop", "/usr/share/applications/", "644"],
    ["build/linux/128x128.png", "/usr/share/icons/hicolor/128x128/apps/icy_mail.png", "644"],
    ["build/linux/256x256.png", "/usr/share/icons/hicolor/256x256/apps/icy_mail.png", "644"],
]
