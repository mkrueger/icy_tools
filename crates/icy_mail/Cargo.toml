[package]
name = "icy_mail"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "An offline QWK and Blue Wave mail reader"
repository = "https://github.com/mkrueger/icy_tools"
autobins = false
default-run = "icy_mail"

[[bin]]
name = "icy_mail"
path = "src/bin/icy_mail.rs"
required-features = ["egui"]

[[bin]]
name = "icy_mail_egui"
path = "src/bin/icy_mail_egui.rs"
required-features = ["egui"]

[[bin]]
name = "icy_mail_legacy"
path = "src/main.rs"
required-features = ["legacy-ui"]

[features]
default = ["egui"]
legacy-ui = ["dep:icy_ui", "dep:rfd", "icy_engine_gui/legacy-ui"]
egui = ["dep:eframe", "dep:rfd", "dep:resvg", "icy_engine_gui/egui"]

[dependencies]
jamjam = { workspace = true }

icy_ui = { workspace = true, optional = true, features = [ "tokio", "svg", "image", "wgpu" ] }
eframe = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }

tokio = { workspace = true }
serde = { workspace = true }
versions = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
webbrowser = { workspace = true }
icy_engine_gui = { workspace = true, features = ["opus-audio"] }
icy_parser_core = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
bstr = { workspace = true }
crc32fast = { workspace = true }
bincode = { workspace = true }
clap = { workspace = true }
#sound
rodio = { workspace = true }
icy_engine = { workspace = true }
walkdir = { workspace = true }
toml = { workspace = true }
image = { workspace = true  }

lazy_static = { workspace = true }
notify = { workspace = true }
human_bytes = { workspace = true }

chrono = { workspace = true, features = ["default", "serde"] }  # Utc hanldung
thiserror = { workspace = true }
anyhow = { workspace = true }

i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
rust-embed = { workspace = true }
once_cell = { workspace = true }
zip = { workspace = true }
unarc-rs = { workspace = true }
fastrand = { workspace = true }

log = { workspace = true }
log4rs = { workspace = true }
web-time = { workspace = true }

# WebSocket support
tungstenite = { workspace = true }

http = { workspace = true }
url = { workspace = true }
rustls = { workspace = true, features = ["tls12"] }
webpki-roots = { workspace = true }
getrandom = { workspace = true }

directories = { workspace = true }
open =  { workspace = true }
rfd =  { workspace = true, optional = true }

tracing-subscriber = { workspace = true }
async-recursion = { workspace = true }
unicode-width = { workspace = true }

[build-dependencies]
winres = { workspace = true }
chrono = { workspace = true, features = ["clock"] }

[package.metadata.bundle]
name = "Icy Mail"
identifier = "com.github.icy_mail"
icon = [ "build/mac/128x128@2x.png" ]
resources = []
copyright = "Copyright (c) Mike Krüger 2025. All rights reserved."

[package.metadata.deb]
section="Mail"
copyright = "Copyright (c) Mike Krüger 2025. All rights reserved."
revision=""
depends = "libasound2"
assets = [
    ["target/release/icy_mail", "/usr/bin/", "755"],
    ["build/linux/icy_mail.desktop", "/usr/share/applications/", "644"],
    ["build/linux/128x128.png", "/usr/share/icons/hicolor/128x128/apps/icy_mail.png", "644"],
    ["build/linux/256x256.png", "/usr/share/icons/hicolor/256x256/apps/icy_mail.png", "644"],
]
