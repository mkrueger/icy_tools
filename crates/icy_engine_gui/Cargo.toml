[package]
name = "icy_engine_gui"
version = "0.5.0"
authors.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
icy_engine = { workspace = true }
icy_parser_core = { workspace = true }
icy_engine_gui_macros = { workspace = true }
codepages = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
rustybuzz = { workspace = true }
ttf-parser = { workspace = true }
fontdb = { workspace = true }
unicode-width = { workspace = true }
tiny-skia = { workspace = true }
parking_lot = { workspace = true}
bitflags = { workspace = true}

icy_ui = { workspace = true, optional = true, features = [ "tokio", "svg", "image", "advanced", "debug", "canvas", "lazy", "wgpu"  ]  }
wgpu = { workspace = true }

lazy_static = { workspace = true }
 
log = { workspace = true }

image = { workspace = true }

i18n-embed = { workspace = true }
i18n-embed-fl= { workspace = true }
rust-embed = { workspace = true } 
once_cell = { workspace = true }
base64 = { workspace = true }
# Ogg-Opus is the music codec of the SyncTERM audio APC; symphonia demuxes it but has no decoder.
opus = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true } 
regex = { workspace = true }

bytemuck = { workspace = true, features = ["derive"] }

egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
clipboard-rs = { workspace = true, optional = true }

# Sound/Music dependencies
anyhow = { workspace = true }
fastrand = { workspace = true }
rodio = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
semver = { workspace = true }

# GitHub release check for the "update available" banners
reqwest = { workspace = true, features = ["json"] }

# File dialog
rfd = { workspace = true, optional = true }

# for Atari ST GIST sounds (IGS)
ym2149-gist-replayer = { workspace = true }
cpal = { workspace = true }

[features]
default = ["legacy-ui", "opus-audio"]
legacy-ui = ["dep:icy_ui", "dep:rfd"]
egui = ["dep:egui", "dep:egui-wgpu", "dep:rfd", "wgpu/default", "system-clipboard"]
# Copy and paste through the system clipboard with every format Icy tools exchange.
system-clipboard = ["dep:clipboard-rs"]
# Ogg-Opus playback for the SyncTERM audio APC music tier. Links libopus,
# so disabling it drops the C dependency; the capability reply follows suit.
opus-audio = ["dep:opus", "dep:symphonia"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "parser_pipeline"
harness = false
