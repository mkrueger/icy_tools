name: Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev nasm
          git submodule update --init
      - name: Run tests
        run: cargo test --locked --all-features
      - name: Debug smoke build
        run: cargo build --locked -p icy_term

