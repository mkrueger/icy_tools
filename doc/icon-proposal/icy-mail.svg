<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Icy Mail — Iconvorschlag</title>
  <desc id="desc">Weißer Briefumschlag auf einer bernsteinfarbenen, facettierten Eis-Kachel.</desc>
  <defs>
    <linearGradient id="tile" x1="32" y1="16" x2="216" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ad762e"/><stop offset="1" stop-color="#604020"/>
    </linearGradient>
    <linearGradient id="edge" x2="1" y2="1">
      <stop stop-color="#ffedc6" stop-opacity=".8"/><stop offset="1" stop-color="#efc17a" stop-opacity=".15"/>
    </linearGradient>
    <clipPath id="clip"><rect x="16" y="16" width="224" height="224" rx="52"/></clipPath>
